# Constroi, publica e implanta as imagens do AtendPraGente: ghcr.io/pachecasatsp/atendpragente-<nome>:<sha7 do commit>.
# Tag imutavel por commit, nunca :latest.
#   pull_request -> testes + build de todas as imagens, SEM publicar (pega Dockerfile quebrado e o patch do Hermes antes do merge)
#   push master  -> testes + build + publica; e, se a variavel DEPLOY_ATENDPRAGENTE for 'true', IMPLANTA no cluster depois da aprovacao manual
#                   do ambiente `producao` (docker/atendpragente/implantar.py: so troca a tag das imagens que ja rodam; nao aplica manifestos).
# Pre-requisitos (uma vez): (1) em cada pacote atendpragente-* > Package settings > "Manage Actions access", adicionar este repositorio com papel Write
# (o GITHUB_TOKEN publica; nao ha PAT de escrita guardado como secret); (2) para implantar, rodar infra-aws/scripts/atendpragente/ci-implantacao.sh
# (papel IAM por OIDC + ServiceAccount + ambiente `producao` + variavel DEPLOY_ATENDPRAGENTE).
name: imagens

on:
  pull_request:
    paths: ["tools/**", "docker/atendpragente/**", ".github/workflows/imagens.yml"]
  push:
    branches: [master]
    paths: ["tools/**", "docker/atendpragente/**", ".github/workflows/imagens.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/pachecasatsp

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12" # a mesma das imagens
      - name: Dependencias
        run: >
          pip install pytest mongomock pyyaml
          -r tools/onboarding-service/requirements.txt
          -r tools/tenant-panel/requirements.txt
          -r tools/comercial-backoffice/requirements.txt
      # Uma execucao por ferramenta: varias tem um pacote `app` com o mesmo nome e nao podem dividir o mesmo processo.
      - name: comercial-backoffice
        run: cd tools/comercial-backoffice && python -m pytest tests -q
      - name: provision-tenant
        run: cd tools/provision-tenant && python -m pytest tests -q
      - name: onboarding-service
        run: cd tools/onboarding-service && python -m pytest tests -q
      - name: tenant-panel
        run: cd tools/tenant-panel && python -m pytest tests -q
      - name: implantar.py
        run: python -m pytest docker/atendpragente/tests -q

  imagens:
    needs: testes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        nome: [tools, panel, sync, backoffice, hermes]
    env:
      PUBLICAR: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag e contexto de build
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          bash docker/atendpragente/montar-contexto.sh "$RUNNER_TEMP/ctx"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login no GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag imutavel: se esta imagem (mesmo commit) ja foi publicada, nao sobrescreve (re-run, workflow_dispatch).
      - name: Imagem ja publicada?
        id: existe
        if: env.PUBLICAR == 'true'
        run: |
          if docker buildx imagetools inspect "$REGISTRY/atendpragente-${{ matrix.nome }}:$TAG" >/dev/null 2>&1; then
            echo "ja=true" >> "$GITHUB_OUTPUT"; echo "::notice::$REGISTRY/atendpragente-${{ matrix.nome }}:$TAG ja existe; mantida."
          else
            echo "ja=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build (publica so fora de pull request)
        if: steps.existe.outputs.ja != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/ctx
          file: ${{ runner.temp }}/ctx/Dockerfile.${{ matrix.nome }}
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ env.REGISTRY }}/atendpragente-${{ matrix.nome }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

  # Troca a tag das imagens que JA rodam no cluster. Passa por aprovacao manual (ambiente `producao`); o papel IAM so e assumivel por jobs desse
  # ambiente (o `sub` do token OIDC inclui `environment:producao`). Acesso ao cluster: tunel do Session Manager ate a 6443 do no (porta fechada na
  # internet) + ServiceAccount `ci-deploy` limitada a patch de Deployments/CronJobs nos dois namespaces; sem acesso a Secrets.
  implantar:
    needs: imagens
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.DEPLOY_ATENDPRAGENTE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: producao
    concurrency:
      group: implantar-atendpragente
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::492715478912:role/recolocarme-staging-atendpragente-deploy
          aws-region: sa-east-1
      - name: Session Manager plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/ssm-plugin.deb
          sudo dpkg -i /tmp/ssm-plugin.deb >/dev/null
      - name: Tunel SSM ate a API do cluster
        run: |
          ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=recolocarme-staging-atendpragente" "Name=instance-state-name,Values=running"                  --query "Reservations[0].Instances[0].InstanceId" --output text)
          [ -n "$ID" ] && [ "$ID" != "None" ] || { echo "no do cluster nao encontrado"; exit 1; }
          nohup aws ssm start-session --target "$ID" --document-name AWS-StartPortForwardingSession             --parameters '{"portNumber":["6443"],"localPortNumber":["16445"]}' > /tmp/ssm-tunnel.log 2>&1 &
          for i in $(seq 1 40); do (echo > /dev/tcp/127.0.0.1/16445) 2>/dev/null && exit 0; sleep 1; done
          echo "tunel SSM nao abriu:"; cat /tmp/ssm-tunnel.log; exit 1
      - name: kubeconfig da ServiceAccount ci-deploy
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_ATENDPRAGENTE }}
        run: |
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"; chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Plano (o que sera trocado)
        run: python docker/atendpragente/implantar.py "${GITHUB_SHA::7}" --simular
      - name: Implantar
        run: python docker/atendpragente/implantar.py "${GITHUB_SHA::7}"
