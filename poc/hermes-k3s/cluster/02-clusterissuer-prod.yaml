# ClusterIssuer de PRODUÇÃO do Let's Encrypt.
# Só troque o ingress para este DEPOIS que o staging tiver funcionado — ou seja,
# depois de ver o certificado de staging emitido com sucesso. O de produção
# emite um certificado válido de verdade, confiável no navegador e aceito pela Meta.
#
# TROQUE <SEU_EMAIL> pelo seu e-mail real.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: <SEU_EMAIL>
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
