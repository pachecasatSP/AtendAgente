# ATENÇÃO: este é um TEMPLATE de exemplo. NÃO coloque o valor real aqui e NÃO
# versione o arquivo preenchido no git.
#
# Token usado para autenticar no gateway público do OTel Collector que roda
# no cluster re-colocar-me (https://otel-consultor-re.colocar-me.com.br).
# É o mesmo valor do Secret "otel-gateway-secrets" (chave "bearer-token") lá
# no cluster re-colocar-me — precisa ser IDÊNTICO nos dois lados.
#
# Crie sem escrever em arquivo:
#   kubectl create secret generic otel-gateway-token -n hermes \
#     --from-literal=bearer-token=<mesmo-valor-do-outro-cluster>
#
# --- Estrutura de referência (NÃO aplique este arquivo com estes valores) ---
apiVersion: v1
kind: Secret
metadata:
  name: otel-gateway-token
  namespace: hermes
type: Opaque
stringData:
  bearer-token: "PREENCHER"
