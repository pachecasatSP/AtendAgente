# Só há 1 nó neste cluster hoje, mas usamos DaemonSet (não Deployment) pelo
# mesmo motivo do cluster re-colocar-me: se um nó for adicionado no futuro,
# o agente já cobre ele automaticamente, sem mudança de manifesto.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: hermes
spec:
  selector:
    matchLabels:
      app: otel-agent
  template:
    metadata:
      labels:
        app: otel-agent
    spec:
      serviceAccountName: otel-agent
      hostNetwork: true
      hostPID: true
      containers:
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.114.0
          args: ["--config=/etc/otel/config.yaml"]
          securityContext:
            runAsUser: 0
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otel-gateway-token
                  key: bearer-token
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-agent-config
        - name: hostfs
          hostPath:
            path: /
