<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Backoffice comercial{% endblock %} — AtendPraGente</title>
<style>
:root {
  color-scheme: light;
  --paper: #FFFCF5; --paper-card: #FFFFFF; --paper-soft: #FFF6E2; --leaf-pale: #E3F7EA;
  --ink: #17231D; --ink-soft: #4A5A50; --ink-faint: #8A9690;
  --leaf: #1FAE5C; --leaf-deep: #0E7A3D; --spark: #FFC93C; --line: #E4E0D0;
  --error: #B33F32; --error-bg: #FBEAE6; --warn: #E8A400; --warn-bg: #FFF3D6;
  --font-display: ui-rounded, 'Segoe UI Rounded', 'Baloo 2', sans-serif;
  --font-body: ui-rounded, 'Segoe UI', 'Nunito', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1B15; --paper-card: #182920; --paper-soft: #16261D; --leaf-pale: #1A3324;
    --ink: #F3F6F1; --ink-soft: #C9D6CC; --ink-faint: #7C8B81;
    --leaf: #35C878; --leaf-deep: #7EE3AC; --spark: #FFD666; --line: #24352B;
    --error: #FF8A75; --error-bg: #3A1712; --warn: #FFD666; --warn-bg: #3A2E12;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1B15; --paper-card: #182920; --paper-soft: #16261D; --leaf-pale: #1A3324;
  --ink: #F3F6F1; --ink-soft: #C9D6CC; --ink-faint: #7C8B81;
  --leaf: #35C878; --leaf-deep: #7EE3AC; --spark: #FFD666; --line: #24352B;
  --error: #FF8A75; --error-bg: #3A1712; --warn: #FFD666; --warn-bg: #3A2E12;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-weight: 500; line-height: 1.55; }
header { background: var(--ink); color: var(--paper); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
header a.brand { color: var(--paper); text-decoration: none; font-family: var(--font-display); font-weight: 800; }
header nav a { color: var(--leaf-pale); margin-left: 16px; font-weight: 700; font-size: 13px; text-decoration: none; }
header nav a:hover { text-decoration: underline; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
h2 { font-family: var(--font-display); font-weight: 800; }
h3 { font-family: var(--font-display); font-weight: 800; font-size: 1rem; }
table { width: 100%; border-collapse: collapse; background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 12px 0; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
th { background: var(--paper-soft); text-transform: uppercase; font-size: 11px; letter-spacing: .04em; color: var(--ink-soft); font-weight: 800; }
tbody tr:last-child td { border-bottom: none; }
.card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin: 14px 0; box-shadow: 0 16px 40px -28px rgba(23,35,29,0.25); }
.metric { display: inline-block; margin-right: 28px; }
.metric .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--leaf-deep); }
.metric .l { font-size: 12px; color: var(--ink-soft); }
form.inline { display: inline; }

/* fieldset/label — mesmo padrão do painel de configurações do tenant */
fieldset { border: none; padding: 0; margin: 0 0 1.2rem; }
legend { font-family: var(--font-display); font-weight: 800; font-size: 0.92rem; margin-bottom: 0.5rem; padding: 0; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; }
label { display: block; margin-top: 0.9rem; font-weight: 800; font-size: 0.85rem; }
label:first-of-type { margin-top: 0; }
.hint { font-weight: 500; color: var(--ink-faint); font-size: 0.76rem; margin-top: 0.2rem; }
.row { display: flex; gap: 0.8rem; align-items: flex-start; flex-wrap: wrap; }
.row > label, .row > * { flex: 1; min-width: 140px; margin-top: 0.9rem; }
.row > label:first-child, .row > *:first-child { margin-top: 0.9rem; }

input, select, textarea, button { font: inherit; }
input:not([type]), input[type=text], input[type=date], input[type=email], input[type=password], input[type=tel], select, textarea {
  width: 100%; padding: 0.55rem 0.7rem; margin-top: 0.35rem;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 10px; box-sizing: border-box; font-size: 0.9rem;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--leaf); outline-offset: 1px; }
button {
  font-weight: 800; font-size: 0.88rem; padding: 0.55rem 1.1rem;
  background: var(--leaf); color: #fff; border: none; border-radius: 999px; cursor: pointer;
}
button:hover { filter: brightness(0.97); }
button.secondary { background: var(--paper-soft); color: var(--ink); border: 1px solid var(--line); }
.erro { color: var(--error); background: var(--error-bg); padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; font-weight: 700; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; }
.pill.ok { background: var(--leaf-pale); color: var(--leaf-deep); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--error-bg); color: var(--error); }

.kanban { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 10px; overflow-x: auto; }
.kanban-col h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); margin: 0 0 8px; font-weight: 800; }
.kanban-col .vazio { color: var(--ink-faint); font-size: 12px; }
.kanban-card { background: var(--paper-soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
.kanban-card small { color: var(--ink-soft); font-size: 12px; }
.kanban-card select { width: 100%; }
.roteiro { margin-top: 0; }
.roteiro summary { cursor: pointer; font-weight: 800; font-size: 12px; color: var(--leaf-deep); list-style: none; }
.roteiro summary::-webkit-details-marker { display: none; }
.roteiro summary::before { content: "▸ "; }
.roteiro[open] summary::before { content: "▾ "; }
.roteiro-corpo { background: var(--paper); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
.roteiro-corpo p { margin: 0 0 6px; }
.roteiro-corpo p:last-child { margin-bottom: 0; }
.roteiro-corpo ul { margin: 0 0 6px; padding-left: 16px; }

.funil-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.funil-label { width: 110px; font-size: 12px; color: var(--ink-soft); text-transform: capitalize; flex-shrink: 0; }
.funil-track { flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; height: 14px; overflow: hidden; }
.funil-fill { height: 100%; background: var(--leaf); border-radius: 999px; }
.funil-fill.status-perdido { background: var(--error); }
.funil-fill.status-fechado { background: var(--leaf-deep); }
.funil-fill.status-proposta { background: var(--warn); }
.funil-valor { width: 24px; text-align: right; font-weight: 800; font-size: 13px; flex-shrink: 0; }
.paginacao { display: flex; align-items: center; gap: 14px; justify-content: center; margin-top: 14px; font-size: 13px; color: var(--ink-soft); }
.paginacao a.secondary-link { color: var(--leaf-deep); font-weight: 800; text-decoration: none; }
.paginacao a.secondary-link:hover { text-decoration: underline; }
.comentarios { background: var(--paper); border-radius: 8px; padding: 6px 8px; }
.comentario { margin: 0; padding: 3px 0; font-size: 12px; border-bottom: 1px dashed var(--line); }
.comentario:last-child { border-bottom: none; }

a { color: var(--leaf-deep); font-weight: 700; text-decoration: none; }
a:hover { text-decoration: underline; }
header nav a { color: var(--leaf-pale); font-weight: 700; }

.pin-gate { position: relative; display: inline-block; }
.pin-popover {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
  display: flex; gap: 6px; align-items: center; white-space: nowrap;
  background: var(--paper-card); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; box-shadow: 0 16px 36px -18px rgba(23,35,29,0.4);
}
.pin-popover input[name=pin] { width: 70px; margin-top: 0; }
.acoes-prospeccao { display: flex; gap: 6px; flex-wrap: wrap; }
button.compacto { padding: 0.4rem 0.7rem; font-size: 0.78rem; }
</style>
</head>
<body>
<header>
  <a href="/" class="brand">AtendPraGente — Backoffice</a>
  <nav>
    {% if vendedor %}<a href="/prospeccao">Prospecção</a>{% endif %}
    {% if vendedor and vendedor.role == "admin" %}
      <a href="/admin/pipeline">Pipeline</a>
      <a href="/admin/vendedores">Vendedores</a>
      <a href="/admin/tenants">Tenants</a>
      <a href="/admin/alertas">Alertas</a>
    {% endif %}
    {% if vendedor %}<a href="/logout">Sair</a>{% endif %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
// Popover de PIN: fica escondido até clicar no botão da ação sensível
// (pausar tenant, desativar vendedor, buscar mais prospecção) — nunca
// aparece o campo de PIN destacado na tela sem intenção.
document.addEventListener('click', (e) => {
  const toggle = e.target.closest('.pin-toggle');
  if (toggle) {
    const pop = toggle.nextElementSibling;
    const abrir = pop.hidden;
    document.querySelectorAll('.pin-popover').forEach((p) => { p.hidden = true; });
    pop.hidden = !abrir;
    if (abrir) pop.querySelector('input[name=pin]')?.focus();
    return;
  }
  if (!e.target.closest('.pin-popover')) {
    document.querySelectorAll('.pin-popover').forEach((p) => { p.hidden = true; });
  }
});
</script>
</body>
</html>
