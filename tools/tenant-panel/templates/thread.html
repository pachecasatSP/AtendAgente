<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Conversa — {{ tenant_id }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    a.back { color: #1a5fb4; text-decoration: none; }
    .msg { margin: 0.75rem 0; padding: 0.6rem 0.8rem; border-radius: 8px; max-width: 80%; white-space: pre-wrap; }
    .user { background: #e8f0fe; margin-right: auto; }
    .assistant { background: #f1f1f1; margin-left: auto; text-align: right; }
    .meta { font-size: 0.75rem; color: #666; margin-top: 0.2rem; }
  </style>
</head>
<body>
  <p><a class="back" href="/painel">&larr; Voltar</a></p>
  <h1>{{ session_id }}</h1>
  {% for m in messages %}
  <div class="msg {{ 'assistant' if m.role == 'assistant' else 'user' }}">
    <div>{{ m.content }}</div>
    <div class="meta">{{ m.role }} — {{ m.timestamp_fmt }}</div>
  </div>
  {% endfor %}
</body>
</html>
