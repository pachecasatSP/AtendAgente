<!doctype html>
<html lang="pt-br">
<head>
{% include "_cabeca.html" %}
<link rel="stylesheet" href="{{ url_estilo('interno.css') }}">
<link rel="stylesheet" href="{{ url_estilo('agenda.css') }}">
<title>Agenda — {{ nome_negocio }}</title>
</head>
<body class="interno" style="--largura: 1180px">
  <div class="pagina">
    {% include "_topo_interno.html" %}

    <main class="card">
      <h1>Agenda</h1>
      <p class="lead">Compromissos marcados pelo bot na sua Google Agenda, por semana.</p>

      <div class="semana-nav">
        <div class="semana-botoes">
          <button type="button" class="btn contorno" id="week-prev">Anterior</button>
          <button type="button" class="btn contorno" id="week-hoje">Hoje</button>
          <button type="button" class="btn contorno" id="week-next">Próxima</button>
        </div>
        <h2 class="semana-rotulo" id="week-label" aria-live="polite"></h2>
      </div>

      <div id="agenda-erro" class="banner erro" role="alert" hidden></div>
      <p id="agenda-carregando" class="vazio" role="status" hidden>Carregando…</p>
      <div id="week-grid" class="semana" aria-label="Compromissos da semana"></div>
    </main>
  </div>
  <script src="{{ url_estilo('interno.js') }}" defer></script>
  <script src="{{ url_estilo('agenda.js') }}" defer></script>
</body>
</html>
