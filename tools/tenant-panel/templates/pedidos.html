<!doctype html>
<html lang="pt-br">
<head>
{% include "_cabeca.html" %}
<link rel="stylesheet" href="{{ url_estilo('interno.css') }}">
<link rel="stylesheet" href="{{ url_estilo('pedidos.css') }}">
<title>Pedidos — {{ nome_negocio }}</title>
</head>
<body class="interno">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-atualizar" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
    <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/></symbol>
    <symbol id="i-pessoa" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-pino" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  </svg>
  <div class="pagina">
    {% include "_topo_interno.html" %}

    <main class="card">
      <div class="cab">
        <h1>Pedidos</h1>
        <div class="atualizar">
          <span id="atualizar-info" class="atualizar-info" role="status"></span>
          <button type="button" id="btn-atualizar" class="btn contorno"><svg class="icone" aria-hidden="true"><use href="#i-atualizar"/></svg>Atualizar</button>
        </div>
      </div>
      <p class="banner perigo"><svg class="icone" aria-hidden="true"><use href="#i-alerta"/></svg><span>Evite fraudes! Sempre confira o pix no extrato da sua conta, para confirmar o pagamento.</span></p>

      <div id="banner-rastreio" class="banner alerta" role="status" hidden><svg class="icone" aria-hidden="true"><use href="#i-alerta"/></svg><span id="banner-rastreio-texto"></span></div>
      <div id="pedidos-erro" class="banner erro" role="alert" hidden></div>
      <div id="pedidos-lista"></div>
      <p id="pedidos-vazio" class="vazio" hidden>Nenhum pedido ainda.</p>
      <div id="carregar-sentinela" class="sentinela"></div>
      <p id="pedidos-carregando" class="vazio">Carregando…</p>
    </main>
  </div>

  <dialog id="modal-itens" class="dialogo" aria-labelledby="modal-itens-titulo">
    <h2 id="modal-itens-titulo">Itens do pedido</h2>
    <div id="modal-itens-lista"></div>
    <form method="dialog" class="acoes"><button class="btn contorno" autofocus>Fechar</button></form>
  </dialog>

  <script src="{{ url_estilo('interno.js') }}" defer></script>
  <script src="{{ url_estilo('pedidos.js') }}" defer></script>
</body>
</html>
