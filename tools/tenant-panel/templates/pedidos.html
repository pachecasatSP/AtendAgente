<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos — Painel {{ tenant_id }}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='124' fill='%231FAE5C'/%3E%3Ccircle cx='246' cy='225' r='80' fill='none' stroke='%23FFFCF5' stroke-width='44'/%3E%3Cpath d='M 166 210 C 180 120, 312 120, 330 215' fill='none' stroke='%23FFFCF5' stroke-width='34' stroke-linecap='round'/%3E%3Ccircle cx='166' cy='215' r='34' fill='%23FFFCF5'/%3E%3Ccircle cx='330' cy='215' r='34' fill='%23FFFCF5'/%3E%3Cpath d='M 330 215 C 400 235, 400 320, 270 365' fill='none' stroke='%23FFFCF5' stroke-width='28' stroke-linecap='round'/%3E%3Ccircle cx='270' cy='365' r='24' fill='%23FFC93C'/%3E%3C/svg%3E">
<style>
:root {
  --paper: #FFFCF5; --paper-card: #FFFFFF; --paper-soft: #FFF6E2; --leaf-pale: #E3F7EA;
  --ink: #17231D; --ink-soft: #4A5A50; --ink-faint: #8A9690;
  --leaf: #1FAE5C; --leaf-deep: #0E7A3D; --spark: #FFC93C; --line: #E4E0D0;
  --error: #C0392B; --error-bg: #FBE9E7; --danger: #D64545; --danger-bg: #FCE9E8;
  --font-display: ui-rounded, 'Segoe UI Rounded', 'Baloo 2', sans-serif;
  --font-body: ui-rounded, 'Segoe UI', 'Nunito', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1B15; --paper-card: #182920; --paper-soft: #16261D; --leaf-pale: #1A3324;
    --ink: #F3F6F1; --ink-soft: #C9D6CC; --ink-faint: #7C8B81;
    --leaf: #35C878; --leaf-deep: #7EE3AC; --spark: #FFD666; --line: #24352B;
    --error: #FF8A75; --error-bg: #3A1712; --danger: #FF8A75; --danger-bg: #3A1712;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1B15; --paper-card: #182920; --paper-soft: #16261D; --leaf-pale: #1A3324;
  --ink: #F3F6F1; --ink-soft: #C9D6CC; --ink-faint: #7C8B81;
  --leaf: #35C878; --leaf-deep: #7EE3AC; --spark: #FFD666; --line: #24352B;
  --error: #FF8A75; --error-bg: #3A1712; --danger: #FF8A75; --danger-bg: #3A1712;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-weight: 500; line-height: 1.5;
  padding: 2.5rem 1.25rem 5rem; display: flex; flex-direction: column; align-items: center;
}
.top { width: 100%; max-width: 980px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.6rem; }
.brand { display: inline-flex; align-items: center; gap: 0.55rem; }
.brand-mark { width: 30px; height: 30px; flex-shrink: 0; }
.brand-word { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: var(--ink); }
.brand-word .pra { color: var(--leaf-deep); }
.back-link { color: var(--ink-faint); text-decoration: none; font-weight: 800; font-size: 0.85rem; }
.back-link:hover { color: var(--leaf-deep); }
.card {
  background: var(--paper-card); border: 1px solid var(--line); border-radius: 20px;
  padding: 1.8rem; max-width: 980px; width: 100%; margin-bottom: 1.5rem;
  box-shadow: 0 20px 50px -30px rgba(23,35,29,0.2);
}
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin: 0 0 0.35rem; }
.lead { color: var(--ink-soft); margin: 0 0 1.2rem; font-size: 0.92rem; }
.hint { font-weight: 500; color: var(--ink-faint); font-size: 0.85rem; text-align: center; padding: 1.5rem 0; }
.banner { padding: 0.7rem 0.9rem; border-radius: 10px; margin-bottom: 1.2rem; font-weight: 700; font-size: 0.86rem; }
.banner.erro { background: var(--error-bg); color: var(--error); }
.banner.perigo { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
.banner.alerta { background: #fff3d6; color: #8a6100; display: flex; align-items: center; gap: 0.5rem; }
:root:not([data-theme="light"]) .banner.alerta { background: #3a2f10; color: #ffd666; }
:root[data-theme="dark"] .banner.alerta { background: #3a2f10; color: #ffd666; }
.pedido-row {
  display: flex; flex-direction: column; gap: 0.5rem; padding: 0.9rem 0.6rem;
  border-bottom: 1px solid var(--line);
}
.pedido-row:last-child { border-bottom: none; }
.pedido-top { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }
.pedido-numero { font-family: var(--font-display); font-weight: 800; color: var(--leaf-deep); font-size: 0.85rem; }
.pedido-destaque { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.pedido-valor { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--ink); }
.pedido-cliente { font-weight: 800; font-size: 0.92rem; }
.pedido-btn.itens { border-color: var(--line); color: var(--ink-soft); font-weight: 700; }
.pedido-btn.itens:hover { background: var(--paper-soft); }
.pedido-meta { font-size: 0.78rem; color: var(--ink-faint); }
.pedido-alerta-rastreio {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; background: #fff3d6; color: #8a6100;
  border-radius: 10px; padding: 0.5rem 0.7rem; font-size: 0.8rem; font-weight: 700;
}
:root:not([data-theme="light"]) .pedido-alerta-rastreio { background: #3a2f10; color: #ffd666; }
:root[data-theme="dark"] .pedido-alerta-rastreio { background: #3a2f10; color: #ffd666; }
.pedido-btn.rastreio-visto { border-color: currentColor; color: inherit; background: transparent; }
.pedido-status {
  font-size: 0.68rem; font-weight: 800; padding: 0.15rem 0.55rem; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.02em;
}
.pedido-status.aberto { background: var(--paper-soft); color: var(--ink-faint); }
.pedido-status.aguardando_pagamento { background: #fff3d6; color: #8a6100; }
.pedido-status.comprovante_recebido { background: #ffe6cc; color: #a15a00; }
.pedido-status.pago { background: var(--leaf-pale); color: var(--leaf-deep); }
.pedido-status.cancelado { background: var(--danger-bg); color: var(--danger); }
.pedido-status.entregue {
  background: var(--leaf-pale); color: var(--leaf-deep);
  /* Essa pill fica dentro de .pedido-acoes, ao lado de botões
     (font-size 0.76rem, padding 0.35rem 0.75rem) — sem isso ficava
     visivelmente menor/desalinhada na linha. */
  font-size: 0.76rem; padding: 0.35rem 0.75rem; align-self: center;
}
.pedido-btn.rastreio { border-color: var(--leaf); color: var(--leaf-deep); }
.pedido-acoes { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.pedido-btn {
  font-family: var(--font-body); font-weight: 800; font-size: 0.76rem; cursor: pointer;
  border-radius: 999px; padding: 0.35rem 0.75rem; border: 1px solid var(--line); background: var(--paper);
  color: var(--ink);
}
.pedido-btn.pagar { border-color: var(--leaf); color: var(--leaf-deep); }
.pedido-btn.pagar:hover { background: var(--leaf-pale); }
.pedido-btn.cancelar { border-color: var(--danger); color: var(--danger); }
.pedido-btn.cancelar:hover { background: var(--danger-bg); }
.pedido-btn:disabled { opacity: 0.6; cursor: default; }
.pedido-endereco { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; background: var(--paper-soft); border-radius: 10px; padding: 0.5rem 0.6rem; }
.pedido-endereco-label { font-weight: 800; font-size: 0.78rem; color: var(--ink-soft); white-space: nowrap; }
.pedido-endereco-input {
  font-family: var(--font-body); font-weight: 600; font-size: 0.85rem; padding: 0.35rem 0.6rem;
  border-radius: 8px; border: 1px solid var(--line); background: var(--paper-card); color: var(--ink);
  flex: 1 1 220px; min-width: 160px;
}
.pedido-btn.endereco { border-color: var(--leaf); color: var(--leaf-deep); }
.pedido-btn.endereco:hover { background: var(--leaf-pale); }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(23,35,29,0.5); display: flex; align-items: center;
  justify-content: center; padding: 1rem; z-index: 100;
}
.modal-box {
  background: var(--paper-card); border-radius: 16px; padding: 1.5rem; max-width: 420px; width: 100%;
  max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 50px -20px rgba(23,35,29,0.4);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.9rem; }
.modal-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; margin: 0; }
.modal-close {
  border: none; background: transparent; color: var(--ink-faint); font-size: 1.3rem; cursor: pointer;
  line-height: 1; padding: 0.1rem 0.4rem;
}
.modal-close:hover { color: var(--ink); }
.modal-item-row { display: flex; justify-content: space-between; gap: 0.8rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
.modal-item-row:last-child { border-bottom: none; }
.modal-item-nome { font-weight: 700; }
.modal-item-valor { color: var(--ink-soft); white-space: nowrap; }
.modal-total { display: flex; justify-content: space-between; margin-top: 0.6rem; padding-top: 0.6rem; border-top: 2px solid var(--line); font-weight: 800; }
.carregar-sentinela { height: 1px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }
.atualizar-wrap { display: flex; align-items: center; gap: 0.5rem; }
.atualizar-info { font-size: 0.76rem; color: var(--ink-faint); }
.pedido-btn.atualizar { border-color: var(--line); color: var(--ink-soft); }
.pedido-btn.atualizar:hover { background: var(--paper-soft); }
.pedido-row.flash { animation: flash-destaque 1.8s ease-out; }
@keyframes flash-destaque {
  0% { background: var(--leaf-pale); }
  100% { background: transparent; }
}
[hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true">
        <rect x="0" y="0" width="512" height="512" rx="124" fill="var(--leaf)"/>
        <circle cx="246" cy="225" r="80" fill="none" stroke="var(--paper-card)" stroke-width="44"/>
        <path d="M 166 210 C 180 120, 312 120, 330 215" fill="none" stroke="var(--paper-card)" stroke-width="34" stroke-linecap="round"/>
        <circle cx="166" cy="215" r="34" fill="var(--paper-card)"/>
        <circle cx="330" cy="215" r="34" fill="var(--paper-card)"/>
        <path d="M 330 215 C 400 235, 400 320, 270 365" fill="none" stroke="var(--paper-card)" stroke-width="28" stroke-linecap="round"/>
        <circle cx="270" cy="365" r="24" fill="var(--spark)"/>
      </svg>
      <span class="brand-word">Atend<span class="pra">Pra</span>Gente</span>
    </div>
    <a href="/painel" class="back-link">&larr; Voltar pras conversas</a>
  </div>

  <div class="card">
    <div class="card-head">
      <h1>Pedidos</h1>
      <div class="atualizar-wrap">
        <span id="atualizar-info" class="atualizar-info"></span>
        <button type="button" id="btn-atualizar" class="pedido-btn atualizar">🔄 Atualizar</button>
      </div>
    </div>
    <div class="banner perigo">⚠️ Evite fraudes! Sempre confira o pix no extrato da sua conta, para confirmar o pagamento.</div>

    <div id="banner-rastreio" class="banner alerta" hidden>🔔 <span id="banner-rastreio-texto"></span></div>
    <div id="pedidos-erro" class="banner erro" hidden></div>
    <div id="pedidos-lista"></div>
    <p id="pedidos-vazio" class="hint" hidden>Nenhum pedido ainda.</p>
    <div id="carregar-sentinela" class="carregar-sentinela"></div>
    <p id="pedidos-carregando" class="hint">Carregando…</p>
  </div>

  <div id="modal-itens" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modal-itens-titulo">Itens do pedido</h2>
        <button type="button" class="modal-close" id="modal-itens-fechar" aria-label="Fechar">&times;</button>
      </div>
      <div id="modal-itens-lista"></div>
    </div>
  </div>

  <script>
    const STATUS_LABEL = {
      aberto: 'Aberto (sem contato)',
      aguardando_pagamento: 'Aguardando pagamento',
      comprovante_recebido: 'Comprovante recebido',
      pago: 'Pago',
      cancelado: 'Cancelado',
    };

    const RASTREIO_SEQUENCIA = ['em_preparacao', 'enviado', 'entregue'];
    const RASTREIO_LABEL = {
      em_preparacao: 'Em preparação',
      enviado: 'Enviado',
      entregue: 'Entregue',
    };

    let offset = 0;
    let carregando = false;
    let acabou = false;
    const pedidosPorId = new Map();

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s == null ? '' : String(s);
      return div.innerHTML;
    }

    function fmtValor(v) {
      return 'R$ ' + (v || 0).toFixed(2).replace('.', ',');
    }

    function fmtData(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function renderPedido(p) {
      const row = document.createElement('div');
      row.className = 'pedido-row';
      row.dataset.id = p.id;

      const statusLabel = STATUS_LABEL[p.status] || p.status;
      const acoes = [];
      if (p.tem_comprovante) {
        acoes.push(`<a class="pedido-btn" href="/painel/api/pedidos/${p.id}/comprovante" target="_blank" rel="noopener">Ver comprovante</a>`);
      }
      if (p.status !== 'pago' && p.status !== 'cancelado') {
        acoes.push('<button type="button" class="pedido-btn pagar" data-acao="pago">Marcar como pago</button>');
        acoes.push('<button type="button" class="pedido-btn cancelar" data-acao="cancelar">Cancelar</button>');
      }
      if (p.status === 'pago') {
        const rastreioAtual = p.rastreio_status || RASTREIO_SEQUENCIA[0];
        const indiceAtual = RASTREIO_SEQUENCIA.indexOf(rastreioAtual);
        const proximo = RASTREIO_SEQUENCIA[indiceAtual + 1];
        if (proximo) {
          acoes.push(`<button type="button" class="pedido-btn rastreio" data-acao-especial="avancar-rastreio">${RASTREIO_LABEL[rastreioAtual]} → ${RASTREIO_LABEL[proximo]}</button>`);
        } else {
          acoes.push(`<span class="pedido-status entregue">${RASTREIO_LABEL[rastreioAtual]}</span>`);
        }
      }

      const qtdItens = (p.itens || []).length;
      const contato = escapeHtml(p.contato_nome || p.chat_id || '');

      // Endereço só faz sentido pra pedido com item tipo "produto"
      // (evento não entrega nada). Captura automática pelo webhook
      // (ver pedido_endereco em mongo_sync/sync_conversations.py)
      // preenche isso sozinha, mas fica editável aqui como fallback —
      // cliente que nunca respondeu, ou tinha mais de 1 pedido em
      // aberto e a captura automática pediu esclarecimento.
      const enderecoHtml = p.precisa_endereco ? `
        <div class="pedido-endereco">
          <span class="pedido-endereco-label">📍 Endereço:</span>
          <input type="text" class="pedido-endereco-input" placeholder="Ainda não informado" value="${escapeHtml(p.endereco || '')}">
          <button type="button" class="pedido-btn endereco" data-acao-especial="salvar-endereco">Salvar</button>
        </div>
      ` : '';

      // Cliente perguntou "qual o status do meu pedido" e não havia
      // rastreio pra responder sozinho (ver pedido_status em mongo_sync/
      // sync_conversations.py) — fica visível até o operador confirmar
      // que já respondeu manualmente.
      const alertaRastreioHtml = p.rastreio_solicitado_em ? `
        <div class="pedido-alerta-rastreio">
          🔔 Cliente perguntou o rastreio às ${fmtData(p.rastreio_solicitado_em)} — responda manualmente
          <button type="button" class="pedido-btn rastreio-visto" data-acao-especial="rastreio-visto">Marcar como visto</button>
        </div>
      ` : '';

      row.innerHTML = `
        <div class="pedido-top">
          <span class="pedido-numero">#${p.numero_exibicao}</span>
          <span class="pedido-status ${p.status}">${statusLabel}</span>
        </div>
        ${alertaRastreioHtml}
        <div class="pedido-destaque">
          <span class="pedido-valor">${fmtValor(p.valor_total)}</span>
          <span class="pedido-cliente">👤 ${contato || 'sem contato'}</span>
          <button type="button" class="pedido-btn itens" data-acao-especial="ver-itens">🛍️ ${qtdItens} ${qtdItens === 1 ? 'item' : 'itens'}</button>
        </div>
        <div class="pedido-meta">${fmtData(p.criado_em)}</div>
        ${enderecoHtml}
        <div class="pedido-acoes">${acoes.join('')}</div>
      `;

      row.querySelectorAll('.pedido-btn[data-acao]').forEach((btn) => {
        btn.addEventListener('click', () => executarAcao(p.id, btn.dataset.acao, btn, row));
      });
      row.querySelectorAll('.pedido-btn[data-acao-especial="avancar-rastreio"]').forEach((btn) => {
        btn.addEventListener('click', () => avancarRastreio(p.id, btn));
      });
      row.querySelectorAll('.pedido-btn[data-acao-especial="salvar-endereco"]').forEach((btn) => {
        btn.addEventListener('click', () => salvarEndereco(p.id, btn, row));
      });
      row.querySelectorAll('.pedido-btn[data-acao-especial="ver-itens"]').forEach((btn) => {
        btn.addEventListener('click', () => abrirModalItens(p));
      });
      row.querySelectorAll('.pedido-btn[data-acao-especial="rastreio-visto"]').forEach((btn) => {
        btn.addEventListener('click', () => marcarRastreioVisto(p.id, btn, row));
      });

      return row;
    }

    function abrirModalItens(p) {
      document.getElementById('modal-itens-titulo').textContent = `Pedido #${p.numero_exibicao}`;
      const listaEl = document.getElementById('modal-itens-lista');
      const linhas = (p.itens || []).map((i) => `
        <div class="modal-item-row">
          <span class="modal-item-nome">${escapeHtml(i.item_nome)}</span>
          <span class="modal-item-valor">${fmtValor(i.valor)}</span>
        </div>
      `).join('');
      listaEl.innerHTML = linhas + `<div class="modal-total"><span>Total</span><span>${fmtValor(p.valor_total)}</span></div>`;
      document.getElementById('modal-itens').hidden = false;
    }

    function fecharModalItens() {
      document.getElementById('modal-itens').hidden = true;
    }

    document.getElementById('modal-itens-fechar').addEventListener('click', fecharModalItens);
    document.getElementById('modal-itens').addEventListener('click', (ev) => {
      if (ev.target.id === 'modal-itens') fecharModalItens();
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') fecharModalItens();
    });

    async function marcarRastreioVisto(id, btn, row) {
      btn.disabled = true;
      try {
        const resp = await fetch(`/painel/api/pedidos/${id}/rastreio-visto`, { method: 'POST' });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || 'Não consegui marcar como visto.');
        row.querySelector('.pedido-alerta-rastreio')?.remove();
        atualizarBannerRastreio();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }

    // Banner no topo somando quantos pedidos (dentre os carregados na
    // tela) têm alerta de rastreio pendente — dá visibilidade sem
    // precisar rolar a lista pra achar a linha certa.
    function atualizarBannerRastreio() {
      const pendentes = [...pedidosPorId.values()].filter((row) => row.querySelector('.pedido-alerta-rastreio'));
      const banner = document.getElementById('banner-rastreio');
      if (pendentes.length === 0) {
        banner.hidden = true;
        return;
      }
      document.getElementById('banner-rastreio-texto').textContent =
        pendentes.length === 1
          ? '1 cliente perguntou o rastreio e está esperando resposta manual.'
          : `${pendentes.length} clientes perguntaram o rastreio e estão esperando resposta manual.`;
      banner.hidden = false;
    }

    // Insere/atualiza uma linha sem redesenhar a lista inteira — usado
    // tanto pela paginação normal (scroll infinito) quanto pelo poll
    // automático (verificarAtualizacoes), pra manter só 1 caminho de
    // inserção e evitar linha duplicada quando o mesmo pedido aparece
    // nos dois (ex: chegou pelo poll antes do scroll alcançar ele).
    function upsertPedido(p, { prepend = false } = {}) {
      const existente = pedidosPorId.get(p.id);
      const assinatura = JSON.stringify(p);
      // Só pisca se já existia com dado diferente (mudou) ou é linha
      // nova chegando via prepend (poll achou pedido que ainda não
      // tinha na tela) — carga inicial/scroll normal não pisca.
      const destacar = existente ? existente.dataset.assinatura !== assinatura : prepend;
      const row = renderPedido(p);
      row.dataset.assinatura = assinatura;
      if (existente) {
        existente.replaceWith(row);
      } else {
        const lista = document.getElementById('pedidos-lista');
        if (prepend && lista.firstChild) {
          lista.insertBefore(row, lista.firstChild);
        } else {
          lista.appendChild(row);
        }
      }
      pedidosPorId.set(p.id, row);
      if (destacar) {
        row.classList.add('flash');
      }
      return row;
    }

    async function salvarEndereco(id, btn, row) {
      const input = row.querySelector('.pedido-endereco-input');
      const endereco = (input.value || '').trim();
      if (!endereco) {
        alert('Digite o endereço.');
        return;
      }
      btn.disabled = true;
      try {
        const resp = await fetch(`/painel/api/pedidos/${id}/endereco`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endereco }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || 'Não consegui salvar o endereço.');
        btn.textContent = 'Salvo ✓';
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function avancarRastreio(id, btn) {
      btn.disabled = true;
      try {
        const resp = await fetch(`/painel/api/pedidos/${id}/avancar-rastreio`, { method: 'POST' });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || 'Não consegui avançar o rastreio.');
        // Recarrega pra trocar o texto do botão pro próximo estado (ou
        // sumir e virar o badge "Entregue" quando chegar no fim).
        recarregar();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }

    async function executarAcao(id, acao, btn, row) {
      btn.disabled = true;
      try {
        const resp = await fetch(`/painel/api/pedidos/${id}/${acao}`, { method: 'POST' });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || 'Não consegui atualizar o pedido.');
        // Recarrega a lista inteira em vez de só ajustar a linha clicada —
        // marcar pago/cancelar age no lote inteiro (Fase 12 revisado,
        // carrinho com vários itens), pode afetar outras linhas já
        // visíveis na tela além da que foi clicada.
        recarregar();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }

    function recarregar() {
      offset = 0;
      acabou = false;
      pedidosPorId.clear();
      document.getElementById('pedidos-lista').innerHTML = '';
      carregarMais();
    }

    async function carregarMais() {
      if (carregando || acabou) return;
      carregando = true;
      const carregandoEl = document.getElementById('pedidos-carregando');
      const erroEl = document.getElementById('pedidos-erro');
      carregandoEl.hidden = false;
      erroEl.hidden = true;
      try {
        const resp = await fetch(`/painel/api/pedidos?offset=${offset}`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || 'Não consegui buscar os pedidos.');
        data.pedidos.forEach((p) => upsertPedido(p));
        offset += data.pedidos.length;
        acabou = !data.tem_mais;
        document.getElementById('pedidos-vazio').hidden = pedidosPorId.size > 0;
        marcarAtualizado();
        atualizarBannerRastreio();
      } catch (err) {
        erroEl.textContent = err.message;
        erroEl.hidden = false;
      } finally {
        carregando = false;
        carregandoEl.hidden = acabou;
      }
    }

    function marcarAtualizado() {
      const el = document.getElementById('atualizar-info');
      const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      el.textContent = `Atualizado às ${agora}`;
    }

    // Poll leve (só a 1ª página, mais recente) pra pegar pedido novo ou
    // mudança de status/endereço enquanto a tela está aberta, sem exigir
    // que o operador recarregue a página manualmente. Não mexe em
    // `offset`/`acabou` do scroll infinito — só insere/atualiza linhas
    // via upsertPedido, então não interfere na paginação em andamento.
    let verificandoAtualizacoes = false;
    async function verificarAtualizacoes() {
      if (verificandoAtualizacoes || carregando) return;
      verificandoAtualizacoes = true;
      try {
        const resp = await fetch('/painel/api/pedidos?offset=0');
        if (!resp.ok) return;
        const data = await resp.json();
        // percorre do mais antigo pro mais novo dentro do lote — cada
        // prepend empurra pro topo, terminando na ordem certa (mais
        // novo primeiro), igual ao que o backend já devolve.
        [...data.pedidos].reverse().forEach((p) => {
          upsertPedido(p, { prepend: !pedidosPorId.has(p.id) });
        });
        if (data.pedidos.length > 0) {
          document.getElementById('pedidos-vazio').hidden = true;
        }
        marcarAtualizado();
        atualizarBannerRastreio();
      } catch (err) {
        // silencioso — poll de fundo não deve incomodar o operador
      } finally {
        verificandoAtualizacoes = false;
      }
    }

    document.getElementById('btn-atualizar').addEventListener('click', () => {
      verificarAtualizacoes();
    });

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) carregarMais();
    });
    observer.observe(document.getElementById('carregar-sentinela'));

    carregarMais();
    setInterval(verificarAtualizacoes, 15000);
  </script>
</body>
</html>
