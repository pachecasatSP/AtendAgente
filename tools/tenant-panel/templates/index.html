<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Painel — {{ tenant_id }}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #222; }
    .layout { display: flex; height: 100vh; }
    .sidebar { width: 320px; flex-shrink: 0; border-right: 1px solid #ddd; overflow-y: auto; background: #fafafa; }
    .sidebar-header { padding: 1rem; font-weight: 600; border-bottom: 1px solid #eee; background: #fff; }
    .conv-item { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    .conv-item:hover { background: #f0f0f0; }
    .conv-item.active { background: #e8f0fe; }
    .conv-name { font-weight: 600; font-size: 0.9rem; }
    .conv-time { font-size: 0.75rem; color: #888; margin-top: 0.15rem; }
    .badge { background: #25d366; color: #fff; border-radius: 999px; padding: 0.1rem 0.5rem; font-size: 0.75rem; min-width: 1.4rem; text-align: center; flex-shrink: 0; }
    .empty { padding: 1rem; color: #888; font-size: 0.9rem; }
    .main { flex: 1; display: flex; flex-direction: column; background: #f7f7f7; }
    .main-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #999; }
    .thread { flex: 1; overflow-y: auto; padding: 1rem; }
    .msg { margin: 0.5rem 0; padding: 0.5rem 0.75rem; border-radius: 8px; max-width: 70%; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { background: #fff; border: 1px solid #eee; margin-right: auto; }
    .msg.assistant { background: #dcf8c6; margin-left: auto; }
    .meta { font-size: 0.7rem; color: #888; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">Conversas — {{ tenant_id }}</div>
      <div id="conv-list"></div>
    </div>
    <div class="main">
      <div id="thread-area" class="main-empty">Selecione uma conversa</div>
    </div>
  </div>

  <script>
    const POLL_MS = 5000;
    const convListEl = document.getElementById('conv-list');
    const threadAreaEl = document.getElementById('thread-area');
    let activeSessionId = null;
    let lastMessagesSignature = null;

    function seenKey(sessionId) { return 'painel-seen-' + sessionId; }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    async function loadSessions() {
      const resp = await fetch('/painel/api/sessions');
      if (!resp.ok) return;
      const sessions = await resp.json();
      convListEl.innerHTML = '';
      if (sessions.length === 0) {
        convListEl.innerHTML = '<div class="empty">Nenhuma conversa ainda.</div>';
        return;
      }
      sessions.forEach((s) => {
        const seenCount = parseInt(localStorage.getItem(seenKey(s.session_id)) || '0', 10);
        const unread = Math.max(0, (s.message_count || 0) - seenCount);
        const item = document.createElement('div');
        item.className = 'conv-item' + (s.session_id === activeSessionId ? ' active' : '');
        item.innerHTML = `
          <div>
            <div class="conv-name">${escapeHtml(s.display_name || s.chat_id || s.session_id)}</div>
            <div class="conv-time">${escapeHtml(s.last_activity_fmt)}</div>
          </div>
          ${unread > 0 ? `<div class="badge">${unread}</div>` : ''}
        `;
        item.addEventListener('click', () => openThread(s.session_id, s.message_count));
        convListEl.appendChild(item);
      });
    }

    async function renderThread(sessionId, { silent } = {}) {
      const resp = await fetch('/painel/api/messages/' + encodeURIComponent(sessionId));
      if (!resp.ok) return;
      const messages = await resp.json();
      const signature = JSON.stringify(messages);
      if (silent && signature === lastMessagesSignature) return; // nada novo, evita re-render/flicker
      lastMessagesSignature = signature;

      threadAreaEl.className = 'thread';
      threadAreaEl.innerHTML = messages
        .map(
          (m) => `
        <div class="msg ${m.role === 'assistant' ? 'assistant' : 'user'}">
          <div>${escapeHtml(m.content)}</div>
          <div class="meta">${escapeHtml(m.role)} — ${escapeHtml(m.timestamp_fmt)}</div>
        </div>`
        )
        .join('');
      threadAreaEl.scrollTop = threadAreaEl.scrollHeight;

      localStorage.setItem(seenKey(sessionId), String(messages.length));
    }

    async function openThread(sessionId, messageCount) {
      activeSessionId = sessionId;
      lastMessagesSignature = null;
      localStorage.setItem(seenKey(sessionId), String(messageCount || 0));
      await renderThread(sessionId);
      await loadSessions(); // atualiza destaque/badge da conversa selecionada
    }

    async function poll() {
      await loadSessions();
      if (activeSessionId) {
        await renderThread(activeSessionId, { silent: true });
      }
    }

    loadSessions();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
