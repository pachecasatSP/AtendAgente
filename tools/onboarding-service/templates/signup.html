<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Conectar WhatsApp — AtendAgente</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; color: #222; text-align: center; }
    button { font-size: 1rem; padding: 0.75rem 1.5rem; background: #1a5fb4; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #164a8f; }
    #status { margin-top: 1rem; color: #555; }
  </style>
</head>
<body>
  <h1>AtendAgente</h1>
  <p>Conecte o WhatsApp do seu negócio pra começar.</p>
  <button id="signup-btn">Conectar WhatsApp</button>
  <p id="status"></p>

  <script>
    window.fbAsyncInit = function () {
      FB.init({ appId: '{{ app_id }}', autoLogAppEvents: true, xfbml: true, version: 'v21.0' });
    };
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

  <script>
    let wabaId = null;
    let phoneNumberId = null;

    window.addEventListener('message', (event) => {
      if (!event.origin || !event.origin.endsWith('facebook.com')) return;
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'WA_EMBEDDED_SIGNUP' && data.event === 'FINISH') {
          wabaId = data.data.waba_id;
          phoneNumberId = data.data.phone_number_id;
        }
      } catch (e) { /* mensagens que não são JSON do embedded signup, ignora */ }
    });

    document.getElementById('signup-btn').addEventListener('click', () => {
      const statusEl = document.getElementById('status');
      FB.login((response) => {
        if (response.authResponse && response.authResponse.code) {
          statusEl.textContent = 'Conectando...';
          fetch('/api/signup/callback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              code: response.authResponse.code,
              waba_id: wabaId,
              phone_number_id: phoneNumberId,
            }),
          })
            .then((r) => { if (!r.ok) throw new Error('callback falhou'); return r.json(); })
            .then((data) => { window.location.href = data.next; })
            .catch(() => { statusEl.textContent = 'Erro ao conectar — tente novamente.'; });
        } else {
          statusEl.textContent = 'Conexão cancelada.';
        }
      }, {
        config_id: '{{ config_id }}',
        response_type: 'code',
        override_default_response_type: true,
      });
    });
  </script>
</body>
</html>
