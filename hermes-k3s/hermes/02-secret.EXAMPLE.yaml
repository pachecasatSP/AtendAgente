# ATENÇÃO: este é um TEMPLATE de exemplo. NÃO coloque valores reais aqui e NÃO
# versione o arquivo preenchido no git — credenciais em repositório é vazamento.
#
# Duas formas de criar o Secret de verdade, sem escrever segredo em arquivo:
#
# OPÇÃO A — a partir do seu .env atual (a mais simples na migração):
#   Copie o ~/.hermes/.env da máquina Oracle para a máquina nova e rode:
#     kubectl create secret generic hermes-env \
#       --namespace hermes \
#       --from-env-file=.env
#   Isso transforma cada linha VAR=valor do .env numa entrada do Secret.
#   Depois APAGUE o .env da máquina (rm .env) — ele já está no cluster.
#
# OPÇÃO B — chave por chave, manualmente:
#   kubectl create secret generic hermes-env -n hermes \
#     --from-literal=WHATSAPP_CLOUD_ACCESS_TOKEN=... \
#     --from-literal=WHATSAPP_CLOUD_APP_SECRET=... \
#     (e assim por diante)
#
# O Deployment (04-deployment.yaml) injeta este Secret inteiro como variáveis
# de ambiente via envFrom. O nome do Secret precisa ser "hermes-env".
#
# --- Estrutura de referência (NÃO aplique este arquivo com estes valores) ---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-env
  namespace: hermes
type: Opaque
stringData:
  WHATSAPP_CLOUD_PHONE_NUMBER_ID: "PREENCHER"
  WHATSAPP_CLOUD_ACCESS_TOKEN: "PREENCHER"
  WHATSAPP_CLOUD_APP_SECRET: "PREENCHER"
  WHATSAPP_CLOUD_WABA_ID: "PREENCHER"
  WHATSAPP_CLOUD_VERIFY_TOKEN: "PREENCHER"
  WHATSAPP_CLOUD_ENABLED: "true"
  # ... demais variáveis do seu .env
