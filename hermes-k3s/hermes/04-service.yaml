# Service interno que expõe o gateway do Hermes dentro do cluster.
# O Ingress (05) roteia o webhook do WhatsApp; o Ingress (06) roteia a API
# OpenAI-compatible. ClusterIP é suficiente — quem expõe é o Ingress.
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - name: webhook
      port: 80
      targetPort: 8090
    - name: api
      port: 8642
      targetPort: 8642
